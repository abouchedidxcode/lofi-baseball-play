<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#14122b" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoFi Baseball" />
    <meta name="format-detection" content="telephone=no" />

    <title>LoFi Baseball</title>
    <style>:root{--col-w:100vw;--col-h:100vh;--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--page-bg:#0d0c1d}html,body{background:var(--page-bg);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;height:100%;margin:0;overflow:hidden}body{position:fixed;inset:0}#backdrop{filter:blur(36px)saturate(1.25)brightness(.5);opacity:0;pointer-events:none;width:112%;height:112%;transition:opacity .8s;position:fixed;top:-6%;left:-6%}body.letterbox #backdrop{opacity:1}#game{width:var(--col-w);height:var(--col-h);touch-action:none;contain:strict;cursor:pointer;background:#000;position:absolute;top:50%;left:50%;overflow:hidden;transform:translate(-50%,-50%)}body.letterbox #game{--safe-top:0px;--safe-right:0px;--safe-bottom:0px;--safe-left:0px;box-shadow:0 0 60px #0009}body.hud-side #game{contain:layout style;overflow:visible}body.hud-side #hud{overflow:visible}@media (min-aspect-ratio:9/16) and (max-aspect-ratio:5/8){body.letterbox #backdrop{opacity:0}body.letterbox #game{box-shadow:none}}#view{width:100%;height:100%;display:block;position:absolute;inset:0}#hud{pointer-events:none;position:absolute;inset:0;overflow:hidden}#hud [data-ui]{pointer-events:auto}#boot{color:#f4e7c8;letter-spacing:.2em;pointer-events:none;background:#14122b;justify-content:center;align-items:center;font:12px/1 ui-monospace,Menlo,monospace;display:flex;position:absolute;inset:0}#boot:after{content:"";background:#f5c542;width:6px;height:6px;margin-left:10px;animation:.8s steps(2,end) infinite blink}@keyframes blink{50%{opacity:0}}</style>
    <script type="module" crossorigin src="./_app/index-CrRI8HnO.js"></script>
    <link rel="stylesheet" crossorigin href="./_app/index-B20Zk-3P.css">

    <canvas id="backdrop" aria-hidden="true"></canvas>
    <main id="game">
      <canvas id="view" aria-label="LoFi Baseball"></canvas>
      <div id="hud"></div>
      <div id="boot">LOADING</div>
    </main>
  </body>
